<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<title>访问日志 · 初中考纲词汇</title>
<style>
  :root {
    --primary: #007AFF; --bg: #F2F2F7; --card: #fff; --text: #1C1C1E;
    --muted: #8E8E93; --green: #34C759; --amber: #FF9500;
    --radius: 12px; --shadow: 0 1px 10px rgba(0,0,0,.07); --hairline: rgba(60,60,67,.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
  header { background: #F9F9F9; color: var(--text); border-bottom: .5px solid var(--hairline); padding: 20px 20px 16px; margin-bottom: 12px; }
  header h1 { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
  header .sub { font-size: 13px; color: var(--muted); margin-top:4px; text-align:right; }
  header .sub a, .back { color: var(--primary); font-size: 14px; text-decoration: none; font-weight: 500; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .stat-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; margin-bottom:14px; }
  .stat { background:var(--card); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .stat .num { font-size:24px; font-weight:700; color:var(--primary); }
  .stat .lbl { font-size:12px; color:var(--muted); margin-top:2px; }
  /* 手机端统计卡: 左色条 + iOS 系统色淡底, 更紧凑清爽 */
  @media (max-width: 640px) {
    .stat-grid { gap: 8px; }
    .stat { padding: 12px 12px 10px 15px; border-radius: 12px; box-shadow: none; }
    .stat::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; }
    .stat .num { font-size: 22px; }
    .stat .lbl { font-size: 11px; margin-top: 1px; }
    .stat:nth-child(1) { background:rgba(0,122,255,.10); } .stat:nth-child(1)::before { background:#007AFF; } .stat:nth-child(1) .num { color:#007AFF; }
    .stat:nth-child(2) { background:rgba(52,199,89,.12); } .stat:nth-child(2)::before { background:#34C759; } .stat:nth-child(2) .num { color:#248A3D; }
    .stat:nth-child(3) { background:rgba(88,86,214,.10); } .stat:nth-child(3)::before { background:#5856D6; } .stat:nth-child(3) .num { color:#5856D6; }
    .stat:nth-child(4) { background:rgba(255,149,0,.12); } .stat:nth-child(4)::before { background:#FF9500; } .stat:nth-child(4) .num { color:#C93400; }
  }
  .card { background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:14px; }
  .card h2 { font-size:14px; color:var(--muted); font-weight:600; margin-bottom:10px; }
  .bars { display:flex; align-items:flex-end; gap:4px; height:80px; }
  .bars .bar { flex:1; background:var(--primary); border-radius:4px 4px 0 0; min-height:3px; position:relative; }
  .bars .bar span { position:absolute; bottom:-16px; left:50%; transform:translateX(-50%); font-size:9px; color:var(--muted); white-space:nowrap; }
  .bars-wrap { padding-bottom:18px; overflow-x:auto; }
  .dev-row { display:flex; align-items:center; gap:8px; margin:7px 0; font-size:13px; }
  .dev-row .track { flex:1; height:8px; border-radius:4px; background:#E5E5EA; overflow:hidden; }
  .dev-row .fill { height:100%; border-radius:4px; background:var(--primary); }
  .dev-row b { min-width:44px; text-align:right; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { text-align:left; color:var(--muted); font-weight:600; padding:8px 6px; border-bottom:1.5px solid #E5E5EA; white-space:nowrap; }
  td { padding:8px 6px; border-bottom:1px solid #E5E5EA; vertical-align:top; }
  tr.log-item td { cursor:pointer; }
  tr.open td.detail { display:block; }
  td.detail { display:none; word-break:break-all; color:var(--muted); background:#F2F2F7; border-radius:8px; padding:8px; }
  .tag { display:inline-block; border-radius:10px; padding:1px 8px; font-size:11px; }
  .tag.pc { background:rgba(88,86,214,.12); color:#5856D6; }
  .tag.手机 { background:rgba(52,199,89,.14); color:#248A3D; }
  .tag.平板 { background:rgba(255,149,0,.14); color:#C93400; }
  .btn { border:none; background:var(--primary); color:#fff; border-radius:14px; padding:8px 18px; font-size:13px; cursor:pointer; font-family:inherit; font-weight:600; }
  .btn:active { opacity:.4; }
  .btn.ghost { background:rgba(0,122,255,.12); color:var(--primary); }
  .empty { text-align:center; color:var(--muted); padding:30px 0; font-size:13px; }
  #tokenBar { display:none; background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
  #tokenBar input { border:1px solid #fde68a; border-radius:8px; padding:6px 10px; margin:0 8px; font-size:13px; width:160px; }
  /* 平板 */
  @media (min-width: 640px) {
    .wrap { max-width: 900px; }
    .stat-grid { grid-template-columns: repeat(4, 1fr); }
  }
  /* 桌面 */
  @media (min-width: 1024px) {
    .wrap { max-width: 1100px; padding-bottom:40px; }
    header h1 { font-size:24px; }
    table { font-size:13px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📊 访问日志</h1>
    <div class="sub"><a class="back" href="/">← 返回背单词</a> &nbsp;·&nbsp; <a class="back" href="/admin.html">⚙ 用户管理</a></div>
    <div class="row">
      <button class="btn ghost" onclick="load()">↻ 刷新</button>
      <span class="sub" id="lastUpdate"></span>
    </div>
  </header>

  <div id="tokenBar">
    此日志已启用访问保护，请输入令牌：
    <input id="tokenInput" placeholder="ADMIN_TOKEN">
    <button class="btn" onclick="saveToken()">查看</button>
  </div>

  <div class="stat-grid">
    <div class="stat"><div class="num" id="sTodayPv">–</div><div class="lbl">今日访问</div></div>
    <div class="stat"><div class="num" id="sTodayUv">–</div><div class="lbl">今日独立 IP</div></div>
    <div class="stat"><div class="num" id="sTotal">–</div><div class="lbl">累计访问</div></div>
    <div class="stat"><div class="num" id="sIps">–</div><div class="lbl">累计独立 IP</div></div>
  </div>

  <div class="card">
    <h2>近 14 天访问趋势</h2>
    <div class="bars-wrap"><div class="bars" id="trend"></div></div>
  </div>

  <div class="card">
    <h2>设备分布</h2>
    <div id="devices"></div>
  </div>

  <div class="card">
    <h2>访问来源 TOP&nbsp;<span id="ipCount"></span></h2>
    <div id="topIps" style="font-size:13px"></div>
  </div>

  <div class="card">
    <h2>最近访问明细（点击行展开 UA）</h2>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>时间</th><th>用户</th><th>IP 地址</th><th>设备</th><th>屏幕 / 语言</th><th>来源页</th></tr></thead>
        <tbody id="logs"></tbody>
      </table>
    </div>
    <div class="empty" id="logEmpty" style="display:none">暂无访问记录</div>
  </div>
</div>

<script>
let timer = null;

function token() { return localStorage.getItem('vlogToken') || ''; }
function saveToken() {
  localStorage.setItem('vlogToken', document.getElementById('tokenInput').value.trim());
  load();
}

function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function load() {
  try {
    const r = await fetch('/api/logs' + (token() ? '?token=' + encodeURIComponent(token()) : ''));
    if (r.status === 401) {
      if (timer) clearInterval(timer);   // 未登录(非管理员) → 跳登录页
      location.replace('/login.html?next=/logs.html');
      return;
    }
    const d = await r.json();
    document.getElementById('tokenBar').style.display = 'none';
    document.getElementById('sTodayPv').textContent = d.todayPv;
    document.getElementById('sTodayUv').textContent = d.todayUv;
    document.getElementById('sTotal').textContent = d.total;
    document.getElementById('sIps').textContent = d.uniqueIps;
    document.getElementById('lastUpdate').textContent = '更新于 ' + new Date(d.now).toLocaleTimeString();
    renderTrend(d.daily);
    renderDevices(d.devices);
    renderIps(d.topIps);
    renderLogs(d.recent);
  } catch (e) {
    document.getElementById('lastUpdate').textContent = '加载失败: ' + e.message;
  }
}

function renderTrend(daily) {
  const days = Object.keys(daily).sort().slice(-14);
  const max = Math.max(1, ...days.map(d => daily[d]));
  const host = document.getElementById('trend');
  host.innerHTML = days.map(d => {
    const h = Math.round(daily[d] / max * 72);
    const short = d.slice(5);
    return `<div class="bar" style="height:${h}px" title="${d} · ${daily[d]} 次"><span>${short}</span></div>`;
  }).join('');
}

function renderDevices(devices) {
  const total = Object.values(devices).reduce((a, b) => a + b, 0) || 1;
  document.getElementById('devices').innerHTML = Object.entries(devices)
    .sort((a, b) => b[1] - a[1])
    .map(([k, n]) => `<div class="dev-row">${k}<div class="track"><div class="fill" style="width:${Math.round(n / total * 100)}%"></div></div><b>${n}</b></div>`)
    .join('') || '<div class="empty">暂无数据</div>';
}

function renderIps(ips) {
  document.getElementById('ipCount').textContent = ips.length;
  document.getElementById('topIps').innerHTML = ips.map(([ip, n]) =>
    `<div class="dev-row">${esc(ip)}<div class="track"><div class="fill" style="width:${Math.round(n / ips[0][1] * 100)}%"></div></div><b>${n}</b></div>`
  ).join('') || '<div class="empty">暂无数据</div>';
}

function renderLogs(list) {
  const tb = document.getElementById('logs');
  document.getElementById('logEmpty').style.display = list.length ? 'none' : 'block';
  tb.innerHTML = list.map((v, i) => `
    <tr class="log-item" onclick="this.classList.toggle('open')">
      <td style="white-space:nowrap">${esc(v.time)}</td>
      <td>${esc(v.user || '匿名')}</td>
      <td>${esc(v.ip)}</td>
      <td><span class="tag ${esc(v.device)}">${esc(v.device)}</span></td>
      <td>${esc(v.screen || '–')}<br><span style="color:#94a3b8">${esc(v.lang || '')}</span></td>
      <td>${esc(v.ref || '直接访问')}</td>
      <td class="detail">UA: ${esc(v.ua || '–')}</td>
    </tr>`).join('');
}

load();
timer = setInterval(load, 30000);   // 30 秒自动刷新
</script>
</body>
</html>
