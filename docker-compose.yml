# 飞牛 NAS (fnOS) Docker Compose 部署
# 1. 将整个「初中单词」目录中的以下文件上传到 NAS，如 /vol1/1000/vocab/
#    index.html  words.js  logs.html  server.js  Dockerfile  docker-compose.yml
# 2. 在 fnOS「Docker」应用 →「Compose」中新建项目，选择该目录，或 SSH 执行:
#    cd /vol1/1000/vocab && docker compose up -d --build
# 3. 访问 http://NAS的IP:8800  学习页面；日志/用户管理需管理员登录
#    默认管理员 admin/admin123（登录 http://NAS的IP:8800/admin.html 后立即改密）
#    用户与设置持久化在 ./data/ 下（users.json / sessions.json / settings.json）
services:
  vocab:
    build: .
    image: vocab-app:latest
    container_name: vocab-app
    ports:
      - "8800:8800"          # 左侧端口可自行修改，如 "8080:8800"
    volumes:
      - ./data:/app/data     # 访问日志 + 用户/会话/设置持久化（NAS 目录）
    environment:
      - TZ=Asia/Shanghai
      # ADMIN_TOKEN 已是兼容旧方式: 管理员登录后无需设置（留空即可）
      - ADMIN_TOKEN=
    restart: unless-stopped
